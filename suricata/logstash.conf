input {
  file {
    path => "/var/log/suricata/eve.json"
    codec => json
    type => "suricata"
    start_position => "beginning"
  }
}
filter {
  if [type] == "suricata" {
    date {
      match => ["timestamp", "ISO8601"]
    }
    if [event_type] == "alert" {
      mutate {
        add_tag => ["suricata-alert"]
      }
    }
  }
}
output {
  elasticsearch {
    hosts => ["https://192.168.20.30:9200"]
    index => "suricata-%{+YYYY.MM.dd}"
    user => "admin"
    password => "CHANGE_ME"
    ssl => true
    ssl_certificate_verification => false
  }
}
